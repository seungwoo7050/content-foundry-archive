name: Public Sites deterministic quality

on:
  pull_request:
    branches: [public-sites]
  push:
    branches: [public-sites]

permissions:
  contents: read

concurrency:
  group: public-sites-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Use the pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile

      - name: Install the pinned browser engines
        run: pnpm exec playwright install chromium firefox webkit

      - name: Run uncached workspace gates
        run: pnpm exec turbo run test typecheck lint build --force

      - name: Validate the vendored v2 release contract
        env:
          CONTENT_RELEASE_DIR: packages/content-contract/vendor/2.0.0/fixtures/bundles/valid/site-a-minimal
        run: pnpm validate:release

      - name: Verify v4 v3 v2 static exports
        run: pnpm --filter @content-foundry/site-a verify:static:paired

      - name: Generate the non-operational QA matrix
        run: pnpm quality:release

      - name: Build and verify all static variants
        run: pnpm quality:sites

      - name: Run the browser matrix gates
        run: pnpm quality:browser:matrix

  lighthouse:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Use the pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the QA workspace dependencies
        run: pnpm exec turbo run build --filter=@content-foundry/site-a^...

      - name: Generate the non-operational QA matrix
        run: pnpm quality:release

      - name: Build and verify all static variants
        run: pnpm quality:sites

      - name: Run three-sample Lighthouse gates
        run: pnpm quality:lighthouse:matrix

      - name: Preserve Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-sites-lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/quality-release/lighthouse
          if-no-files-found: warn
          retention-days: 7
